<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" fill="#070b0f"/>

  <!-- Outer hexagon -->
  <polygon
    points="16,2.5 27.5,9.25 27.5,22.75 16,29.5 4.5,22.75 4.5,9.25"
    fill="none"
    stroke="#00ff41"
    stroke-width="1.2"
    opacity="0.9"
  />

  <!-- Inner hexagon -->
  <polygon
    points="16,7 23.5,11.25 23.5,20.75 16,25 8.5,20.75 8.5,11.25"
    fill="none"
    stroke="#00ff41"
    stroke-width="0.6"
    opacity="0.4"
  />

  <!-- Center dot with glow -->
  <circle cx="16" cy="16" r="2.8" fill="#00ff41" opacity="0.95"/>
  <circle cx="16" cy="16" r="5"   fill="#00ff41" opacity="0.08"/>

  <!-- Corner accent marks -->
  <line x1="16" y1="2.5"  x2="16" y2="5.5"  stroke="#00d4ff" stroke-width="0.8" opacity="0.6"/>
  <line x1="16" y1="26.5" x2="16" y2="29.5" stroke="#00d4ff" stroke-width="0.8" opacity="0.6"/>
</svg>
